<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>PlantGarden 1.1.1</title>
<style>
:root{--bg:#f4f1e8;--card:#fffdf8;--ink:#17352b;--muted:#6f7c75;--green:#52745f;--line:#dde4dc;--shadow:0 12px 30px rgba(27,54,42,.10);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}
.app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:88px}header{padding:20px 16px 10px;display:flex;justify-content:space-between;align-items:center}h1,h2,h3{font-family:Georgia,serif;margin:0}.eyebrow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:3px}
.screen{display:none;padding:0 12px 28px}.screen.active{display:block}.card{background:var(--card);border:1px solid rgba(30,70,50,.08);border-radius:22px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:7px;flex-wrap:wrap;padding:10px}.toolbar button{border:0;border-radius:999px;padding:8px 10px;background:#eef1ec;color:var(--ink);font-size:11px;font-weight:800}.toolbar button.active{background:var(--ink);color:white}
.plan{position:relative;height:430px;margin:0 10px 10px;background:#dfe5db;border-radius:20px;overflow:hidden;touch-action:none}svg{position:absolute;inset:0;width:100%;height:100%}#gardenPoly{fill:#e8e1cc;stroke:#607762;stroke-width:5}.point{fill:white;stroke:#17352b;stroke-width:4}.obj{position:absolute;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;border:0}.plantObj{border-radius:50%;background:#54785b;color:white;border:2px solid white;box-shadow:0 4px 10px rgba(0,0,0,.18);font-size:20px;overflow:hidden}.plantObj img{width:100%;height:100%;object-fit:cover}.bedObj{background:rgba(154,190,137,.66);border:2px solid #6d8a69;border-radius:18px;color:var(--ink);font-size:10px;font-weight:800}.potObj{border-radius:50%;background:#d8cbbb;border:3px solid #806c57;font-size:19px}.selected{outline:3px solid var(--ink);outline-offset:3px;z-index:8}
.status{padding:10px 14px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.section{margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:0 2px 9px}.textbtn{border:0;background:none;color:var(--green);font-weight:800}.list{display:grid;gap:8px}.row{border:0;padding:11px;display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;text-align:left;color:var(--ink)}.thumb{width:50px;height:50px;border-radius:14px;background:#edf2e7;display:grid;place-items:center;font-size:25px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.row p{margin:3px 0 0;color:var(--muted);font-size:11px}.badge{display:inline-block;background:#edf2ed;border-radius:999px;padding:4px 7px;font-size:9px;margin:4px 4px 0 0}.search{margin-bottom:10px;padding:10px 12px;border-radius:15px;border:0;background:#eef1ec;width:100%}
.bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);height:76px;background:rgba(255,253,248,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 70px 1fr 1fr;align-items:center}.nav{border:0;background:none;color:var(--muted);display:grid;place-items:center;font-size:10px}.nav span{font-size:20px}.nav.active{color:var(--ink);font-weight:800}.fab{width:56px;height:56px;border:0;border-radius:50%;background:var(--ink);color:white;font-size:30px;justify-self:center;transform:translateY(-8px)}
.backdrop{position:fixed;inset:0;background:rgba(10,30,22,.42);z-index:30;display:none}.backdrop.open{display:block}.sheet{position:fixed;z-index:40;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:12px 16px 28px;transition:.2s}.sheet.open{transform:translate(-50%,0)}.sheethead{display:flex;justify-content:space-between;align-items:start;margin-bottom:12px}.close{border:0;width:34px;height:34px;border-radius:50%;font-size:20px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:11px;font-weight:800}.field input,.field select{padding:11px;border:1px solid var(--line);border-radius:12px;background:white}.primary{width:100%;border:0;border-radius:13px;padding:12px;background:var(--ink);color:white;font-weight:800}.result{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:10px;text-align:left;margin-top:7px;color:var(--ink)}.profilegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#f0f3ee;border-radius:14px;padding:10px}.box small{display:block;color:var(--muted);margin-bottom:3px}.tip{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}.photo{width:86px;height:86px;border-radius:20px;background:#edf2e7;display:grid;place-items:center;font-size:38px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}
.notice{padding:10px 12px;margin-bottom:10px;font-size:10px;color:var(--muted)}.green{color:#4f7556}.warn{color:#a36d2f}
</style>
</head>
<body>
<div class="app">
<header><div><div class="eyebrow">PlantGarden 1.1.1 · stabiler Teststand</div><h1 id="title">Mein Garten</h1></div><button id="resetBtn" class="textbtn">↺</button></header>

<main id="gardenScreen" class="screen active">
<div class="card">
<div class="toolbar">
<button id="editBtn">✥ Bearbeiten</button><button id="shapeBtn">📐 Gartenform</button><button id="bedBtn">＋ Beet</button><button id="potBtn">＋ Topf</button><button id="plantBtn">＋ Pflanze</button>
</div>
<div class="plan" id="plan"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="gardenPoly"></polygon><g id="points"></g></svg><div id="objects"></div></div>
<div class="status"><span id="gardenSize"></span><span id="modeText">Ansicht</span></div>
</div>
<section class="section"><div class="sectionhead"><h2>Meine Pflanzen</h2><button class="textbtn" onclick="showScreen('plants')">Alle Pflanzen</button></div><div class="list" id="myPlants"></div></section>
</main>

<main id="plantsScreen" class="screen">
<input class="search" id="plantSearch" placeholder="Pflanze suchen …">
<div class="notice card"><b id="plantCount">143</b> Pflanzen im eingebetteten Katalog – ohne externe Datei.</div>
<div class="list" id="plantCatalog"></div>
</main>

<main id="animalsScreen" class="screen">
<input class="search" id="animalSearch" placeholder="Tier suchen …">
<div class="notice card"><b id="animalCount">70</b> Tiere im eingebetteten Katalog.</div>
<div class="list" id="animalCatalog"></div>
</main>

<main id="todayScreen" class="screen"><div class="card notice"><h2>Heute</h2><p>Pflegeübersicht folgt als nächster stabiler Ausbau.</p></div></main>
</div>

<nav class="bottom">
<button class="nav active" data-screen="garden"><span>⌂</span>Garten</button>
<button class="nav" data-screen="plants"><span>🌿</span>Pflanzen</button>
<button class="fab" id="fab">＋</button>
<button class="nav" data-screen="animals"><span>🐞</span>Tiere</button>
<button class="nav" data-screen="today"><span>✓</span>Heute</button>
</nav>
<div class="backdrop" id="backdrop"></div><div class="sheet" id="sheet"><div id="sheetContent"></div></div>
<input type="file" accept="image/*" capture="environment" id="photoInput" hidden>

role":"Zersetzer","eco":"sehr hoch","damage":"selten an Keimlingen","benefit":"zersetzt abgestorbenes Pflanzenmaterial","risk":"A"},{"name":"Mauerassel","latin":"Oniscus asellus","icon":"🪲","role":"Zersetzer","eco":"sehr hoch","damage":"meist harmlos","benefit":"Humusbildung und Stoffkreislauf","risk":"A"},{"name":"Regenwurm","latin":"Lumbricidae","icon":"🪱","role":"Bodenverbesserer","eco":"sehr hoch","damage":"kein Pflanzenschädling","benefit":"Bodenlockerung, Humusbildung","risk":"A"},{"name":"Kompostwurm","latin":"Eisenia fetida","icon":"🪱","role":"Zersetzer","eco":"sehr hoch","damage":"kein Pflanzenschädling","benefit":"schneller Abbau organischen Materials","risk":"A"},{"name":"Hundertfüßer","latin":"Chilopoda","icon":"🪱","role":"Räuber","eco":"hoch","damage":"kein Pflanzenschädling","benefit":"frisst kleine Bodentiere","risk":"A"},{"name":"Tausendfüßer","latin":"Diplopoda","icon":"🪱","role":"Zersetzer","eco":"hoch","damage":"gelegentlich Keimlingsfraß","benefit":"zersetzt Pflanzenreste","risk":"A"},{"name":"Nacktschnecke","latin":"Arion spp.","icon":"🐌","role":"Pflanzenfresser","eco":"mittel","damage":"kann starke Fraßschäden verursachen","benefit":"Nahrung für viele Tiere, Zersetzeranteil","risk":"C"},{"name":"Weinbergschnecke","latin":"Helix pomatia","icon":"🐌","role":"Pflanzenfresser / Zersetzer","eco":"hoch","damage":"meist geringere Schäden","benefit":"frisst auch welkes Material","risk":"A"},{"name":"Hain-Bänderschnecke","latin":"Cepaea nemoralis","icon":"🐌","role":"Pflanzenfresser / Zersetzer","eco":"hoch","damage":"meist geringe Schäden","benefit":"Teil des Stoffkreislaufs","risk":"A"},{"name":"Tagpfauenauge","latin":"Aglais io","icon":"🦋","role":"Bestäuber / Raupenfutter","eco":"sehr hoch","damage":"Raupen an Brennnesseln","benefit":"wichtiger Bestäuber","risk":"A"},{"name":"Kleiner Fuchs","latin":"Aglais urticae","icon":"🦋","role":"Bestäuber / Raupenfutter","eco":"sehr hoch","damage":"Raupen an Brennnesseln","benefit":"wichtiger Bestäuber","risk":"A"},{"name":"Admiral","latin":"Vanessa atalanta","icon":"🦋","role":"Bestäuber / Raupenfutter","eco":"hoch","damage":"Raupen an Brennnesseln","benefit":"Bestäubung","risk":"A"},{"name":"Zitronenfalter","latin":"Gonepteryx rhamni","icon":"🦋","role":"Bestäuber","eco":"sehr hoch","damage":"Raupen an Faulbaum/Kreuzdorn","benefit":"früher Bestäuber","risk":"A"},{"name":"Schwalbenschwanz","latin":"Papilio machaon","icon":"🦋","role":"Bestäuber / Raupenfutter","eco":"sehr hoch","damage":"Raupen an Doldenblütlern","benefit":"hoher Biodiversitätswert","risk":"A"},{"name":"Kohlweißling","latin":"Pieris brassicae","icon":"🦋","role":"Bestäuber / Pflanzenfresser","eco":"hoch","damage":"Raupen an Kohl können starke Schäden machen","benefit":"wichtiger Teil der Nahrungskette","risk":"B"},{"name":"Aurorafalter","latin":"Anthocharis cardamines","icon":"🦋","role":"Bestäuber","eco":"sehr hoch","damage":"Raupen u. a. an Wiesenschaumkraut","benefit":"hoher Biodiversitätswert","risk":"A"},{"name":"Taubenschwänzchen","latin":"Macroglossum stellatarum","icon":"🦋","role":"Bestäuber","eco":"hoch","damage":"Raupen an Labkräutern","benefit":"Bestäubung","risk":"A"},{"name":"Gammaeule","latin":"Autographa gamma","icon":"🦋","role":"Bestäuber / Pflanzenfresser","eco":"mittel","damage":"Raupen an vielen Pflanzen","benefit":"Teil der Nahrungskette","risk":"B"},{"name":"Engerling","latin":"Scarabaeidae-Larven","icon":"🪱","role":"Larve / Zersetzer bzw. Wurzelfresser","eco":"variabel","damage":"je nach Art harmlos bis problematisch","benefit":"Artbestimmung wichtig","risk":"C"},{"name":"Schnakenlarve","latin":"Tipulidae-Larven","icon":"🪱","role":"Zersetzer / Pflanzenfresser","eco":"mittel","damage":"teils Wurzelschäden","benefit":"zersetzt organisches Material","risk":"B"},{"name":"Trauermückenlarve","latin":"Sciaridae-Larven","icon":"🪱","role":"Zersetzer / Topfschädling","eco":"mittel","damage":"bei Massenbefall Wurzelschäden","benefit":"zersetzt Pilze/Material","risk":"C"},{"name":"Ameise","latin":"Formicidae","icon":"🐜","role":"Bodeningenieur / Räuber","eco":"hoch","damage":"kann Blattläuse fördern","benefit":"Bodenlockerung, Räuber, Samenverbreitung","risk":"A"},{"name":"Rote Waldameise","latin":"Formica rufa","icon":"🐜","role":"Räuber / Bodeningenieur","eco":"sehr hoch","damage":"kein klassischer Pflanzenschädling","benefit":"reguliert Insektenpopulationen","risk":"A"},{"name":"Stechmücke","latin":"Culicidae","icon":"🦟","role":"Nahrungskette","eco":"mittel","damage":"kein Pflanzenschädling","benefit":"Nahrung für viele Tiere","risk":"C"},{"name":"Mücke / Trauermücke","latin":"Nematocera","icon":"🦟","role":"variabel","eco":"mittel","damage":"je nach Art","benefit":"Nahrung für Räuber","risk":"B"},{"name":"Libelle","latin":"Odonata","icon":"🪰","role":"Räuber","eco":"sehr hoch","damage":"kein Pflanzenschädling","benefit":"jagt Mücken und andere Insekten","risk":"A"},{"name":"Eintagsfliege","latin":"Ephemeroptera","icon":"🪰","role":"Wasserökosystem","eco":"hoch","damage":"kein Pflanzenschädling","benefit":"wichtige Nahrungskette","risk":"A"},{"name":"Köcherfliege","latin":"Trichoptera","icon":"🪰","role":"Wasserökosystem","eco":"hoch","damage":"kein Pflanzenschädling","benefit":"wichtige Nahrungskette","risk":"A"}];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const defaultState={garden:{width:12,height:20,shape:[[8,8],[92,8],[92,92],[8,92]]},objects:[],plants:[]};
let state;try{state=JSON.parse(localStorage.getItem('pg111')||'null')}catch(e){}if(!state)state=structuredClone(defaultState);
let edit=false, shapeEdit=false, selected=null, drag=null, photoTarget=null;
function save(){localStorage.setItem('pg111',JSON.stringify(state))}
function plantData(name){return catalog.find(x=>x.name===name)||{name,icon:'🌱',bot:'',life:'—',water:'—',light:'—',max:'—',pot:false,eco:'—',status:'—',cat:'—',child:'—',fert:'—',cut:'—',prop:'—',home:'—'}}
function cover(p){if(p.photos&&p.photos.length)return `<img src="${p.photos[p.photos.length-1]}">`;return plantData(p.name).icon}
function openSheet(body){$('#sheetContent').innerHTML=body;$('#backdrop').classList.add('open');$('#sheet').classList.add('open')}
function closeSheet(){$('#backdrop').classList.remove('open');$('#sheet').classList.remove('open')}$('#backdrop').onclick=closeSheet;
function head(t,s=''){return `<div class="sheethead"><div><div class="eyebrow">${s}</div><h2>${t}</h2></div><button class="close" onclick="closeSheet()">×</button></div>`}
function render(){
 $('#gardenPoly').setAttribute('points',state.garden.shape.map(p=>p.join(',')).join(' '));
 const pts=$('#points');pts.innerHTML='';if(shapeEdit)state.garden.shape.forEach((p,i)=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',2.2);c.setAttribute('class','point');c.dataset.i=i;pts.appendChild(c)});
 const obj=$('#objects');obj.innerHTML='';state.objects.forEach(o=>{let e=document.createElement('button');e.dataset.id=o.id;e.className='obj '+(o.type==='plant'?'plantObj':o.type==='bed'?'bedObj':'potObj');if(selected===o.id)e.classList.add('selected');if(o.type==='plant'){const p=state.plants.find(p=>p.id===o.plantId);e.innerHTML=p?cover(p):'🌱'}else e.textContent=o.type==='bed'?(o.label||'Beet'):'🪴';Object.assign(e.style,{left:o.x+'%',top:o.y+'%',width:o.w+'%',height:o.h+'%'});obj.appendChild(e)});
 $('#gardenSize').textContent=`${state.garden.width} × ${state.garden.height} m`;
 $('#modeText').textContent=shapeEdit?'Gartenform bearbeiten':edit?'Objekte verschieben':'Ansicht';
 renderMyPlants();save()
}
function renderMyPlants(){const l=$('#myPlants');l.innerHTML='';if(!state.plants.length){l.innerHTML='<div class="notice card">Noch keine Pflanzen im Garten. Tippe auf „＋ Pflanze“.</div>';return}state.plants.forEach(p=>{const d=plantData(p.name),b=document.createElement('button');b.className='row card';b.innerHTML=`<div class="thumb">${cover(p)}</div><div><b>${p.nickname||p.name}</b><p>${d.bot}</p><span class="badge">${d.life}</span><span class="badge">💧 ${d.water}</span></div><span>›</span>`;b.onclick=()=>openProfile(p.id);l.appendChild(b)})}
function renderCatalog(filter=''){const q=filter.toLowerCase(),l=$('#plantCatalog');l.innerHTML='';catalog.filter(d=>(d.name+' '+d.bot).toLowerCase().includes(q)).forEach(d=>{const b=document.createElement('button');b.className='row card';b.innerHTML=`<div class="thumb">${d.icon}</div><div><b>${d.name}</b><p>${d.bot}</p><span class="badge">${d.life}</span><span class="badge">${d.status}</span></div><span>＋</span>`;b.onclick=()=>addPlant(d.name);l.appendChild(b)})}
function renderAnimals(filter=''){const q=filter.toLowerCase(),l=$('#animalCatalog');l.innerHTML='';animals.filter(a=>(a.name+' '+a.latin+' '+a.role).toLowerCase().includes(q)).forEach(a=>{const b=document.createElement('button');b.className='row card';b.innerHTML=`<div class="thumb">${a.icon}</div><div><b>${a.name}</b><p>${a.latin}</p><span class="badge">${a.role}</span></div><span>›</span>`;b.onclick=()=>openAnimal(a);l.appendChild(b)})}
function addPlant(name){const p={id:'p'+Date.now(),name,nickname:name,photos:[]};state.plants.push(p);state.objects.push({id:'o'+Date.now(),type:'plant',plantId:p.id,x:45,y:45,w:10,h:10});closeSheet();showScreen('garden');edit=true;$('#editBtn').classList.add('active');render();openProfile(p.id)}
function openProfile(id){const p=state.plants.find(x=>x.id===id);if(!p)return;const d=plantData(p.name);openSheet(head(p.nickname||p.name,d.bot)+`<div style="display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center"><div class="photo">${cover(p)}</div><div><b>${d.life} · ${d.light}</b><p style="font-size:11px;color:var(--muted)">Wasser: ${d.water} · Max.: ${d.max}</p><button class="primary" onclick="pickPhoto('${p.id}')">📷 Foto hinzufügen</button></div></div><div class="profilegrid" style="margin-top:12px"><div class="box"><small>Topfgeeignet</small><b>${d.pot?'Ja':'Nein'}</b></div><div class="box"><small>Ökologiewert</small><b>${d.eco}/100</b></div><div class="box"><small>Status</small><b>${d.status}</b></div><div class="box"><small>Katzenindex</small><b>${d.cat}</b></div><div class="box"><small>Kinderindex</small><b>${d.child}</b></div><div class="box"><small>Düngung</small><b>${d.fert}</b></div></div><div class="tip"><b>Natürlich düngen</b><p>${d.home}</p></div><div class="tip"><b>Schnitt</b><p>${d.cut}</p></div><div class="tip"><b>Vermehrung</b><p>${d.prop}</p></div>`)}
function openAnimal(a){openSheet(head(a.name,a.latin)+`<div class="profilegrid"><div class="box"><small>Rolle</small><b>${a.role}</b></div><div class="box"><small>Nutzen</small><b>${a.eco}</b></div><div class="box"><small>Pflanzenschaden</small><b>${a.damage}</b></div><div class="box"><small>Risiko</small><b>${a.risk}</b></div></div><div class="tip"><b>Ökologischer Beitrag</b><p>${a.benefit}</p></div>`)}
window.pickPhoto=id=>{photoTarget=id;$('#photoInput').click()};$('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f||!photoTarget)return;const r=new FileReader();r.onload=()=>{const p=state.plants.find(p=>p.id===photoTarget);p.photos.push(r.result);save();render();openProfile(photoTarget)};r.readAsDataURL(f)};
function showAddPlant(){openSheet(head('Pflanze hinzufügen','143 Arten')+`<input class="search" id="addSearch" placeholder="Name eingeben …"><div id="addResults"></div>`);const draw=q=>{const target=$('#addResults');target.innerHTML='';catalog.filter(d=>(d.name+' '+d.bot).toLowerCase().includes(q.toLowerCase())).slice(0,30).forEach(d=>{const b=document.createElement('button');b.className='result';b.innerHTML=`<b>${d.name}</b><small>${d.bot}</small>`;b.onclick=()=>addPlant(d.name);target.appendChild(b)})};draw('');$('#addSearch').oninput=e=>draw(e.target.value)}
$('#plantBtn').onclick=showAddPlant;$('#fab').onclick=showAddPlant;
$('#bedBtn').onclick=()=>{state.objects.push({id:'b'+Date.now(),type:'bed',label:'Neues Beet',x:25,y:35,w:35,h:20});edit=true;render()};
$('#potBtn').onclick=()=>{state.objects.push({id:'t'+Date.now(),type:'pot',x:35,y:60,w:10,h:10});edit=true;render()};
$('#editBtn').onclick=()=>{edit=!edit;shapeEdit=false;$('#editBtn').classList.toggle('active',edit);render()};
$('#shapeBtn').onclick=()=>openSheet(head('Gartenform','maßstäblich')+`<div class="field"><label>Breite m</label><input id="gw" type="number" step=".1" value="${state.garden.width}"></div><div class="field"><label>Länge m</label><input id="gh" type="number" step=".1" value="${state.garden.height}"></div><button class="result" id="rect">▭ Rechteck</button><button class="result" id="lshape">⌞ L-Form</button><button class="result" id="free">✥ Ecken frei verschieben</button><button class="primary" id="saveShape">Übernehmen</button>`);
document.addEventListener('click',e=>{if(e.target.id==='rect')state.garden.shape=[[8,8],[92,8],[92,92],[8,92]];if(e.target.id==='lshape')state.garden.shape=[[8,8],[92,8],[92,50],[60,50],[60,92],[8,92]];if(e.target.id==='free'){shapeEdit=true;edit=false;closeSheet();render()}if(e.target.id==='saveShape'){state.garden.width=+$('#gw').value||12;state.garden.height=+$('#gh').value||20;closeSheet();render()}});
$('#objects').addEventListener('pointerdown',e=>{const el=e.target.closest('.obj');if(!el)return;selected=el.dataset.id;render();if(!edit)return;const o=state.objects.find(o=>o.id===selected),r=$('#plan').getBoundingClientRect();drag={kind:'obj',o,sx:e.clientX,sy:e.clientY,x:o.x,y:o.y,r}});
$('#plan').addEventListener('pointerdown',e=>{if(!shapeEdit||e.target.tagName!=='circle')return;const i=+e.target.dataset.i,r=$('#plan').getBoundingClientRect();drag={kind:'point',i,r}});
$('#plan').addEventListener('pointermove',e=>{if(!drag)return;if(drag.kind==='obj'){drag.o.x=Math.max(0,Math.min(100-drag.o.w,drag.x+(e.clientX-drag.sx)/drag.r.width*100));drag.o.y=Math.max(0,Math.min(100-drag.o.h,drag.y+(e.clientY-drag.sy)/drag.r.height*100));render()}else{state.garden.shape[drag.i]=[Math.max(2,Math.min(98,(e.clientX-drag.r.left)/drag.r.width*100)),Math.max(2,Math.min(98,(e.clientY-drag.r.top)/drag.r.height*100))];render()}});
$('#plan').addEventListener('pointerup',()=>{drag=null;save()});
$('#plantSearch').oninput=e=>renderCatalog(e.target.value);$('#animalSearch').oninput=e=>renderAnimals(e.target.value);
function showScreen(s){$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+s+'Screen').classList.add('active');$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.screen===s));$('#title').textContent=s==='garden'?'Mein Garten':s==='plants'?'Pflanzen':s==='animals'?'Tiere':'Heute'}
$$('.nav').forEach(n=>n.onclick=()=>showScreen(n.dataset.screen));
$('#resetBtn').onclick=()=>{if(confirm('Testdaten und Garten zurücksetzen?')){localStorage.removeItem('pg111');state=structuredClone(defaultState);render()}};
render();renderCatalog();renderAnimals();
</script>
</body></html>
